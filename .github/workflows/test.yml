name: Zig Build and Test
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    name: Build and Test
    steps:
      - name: Install dependencies
        run: sudo apt install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev

      - uses: actions/checkout@v4

      - name: Zig setup
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run tests
        run: zig build test --summary all

      - name: Check native and Windows release builds
        run: zig build release-build

  macos-release-build:
    runs-on: macos-14
    name: Check macOS release build
    steps:
      - uses: actions/checkout@v4

      - name: Zig setup
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build release binary
        run: zig build -Doptimize=ReleaseSafe
